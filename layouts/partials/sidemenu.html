<!-- Menu toggle -->
<a href="#menu" class="menu-link" id="menuLink" aria-label="Go to menu of this website">
  <s class="bar"></s><s class="bar"></s>
</a>
<div id="menu">

  {{ partial "brand.html" . }}

  <div class="pure-menu">
    <ul class="pure-menu-list">
      {{ range .Site.Menus.main }}
        {{ if .HasChildren }}
          <li class="pure-menu-item pure-menu-has-children">
            <a class="pure-menu-link" href="#" aria-label='open sub menu'>{{ .Pre }}<span>{{ .Name }}</span></a>
            <ul class="pure-menu-children">
              {{ range .Children }}
                <li class="pure-menu-item">
                  <a class="pure-menu-link" href="{{ .URL | relLangURL }}" aria-label='go to menu link'>{{ .Name }}</a>
                </li>
              {{ end }}
            </ul>
          </li>
        {{else}}
          <li class="pure-menu-item">
            <a class="pure-menu-link" href="{{ .URL | relLangURL }}" aria-label='go to menu link'>{{ .Pre }}<span>{{ .Name }}</span></a>
          </li>
        {{end}}
      {{end}}
    </ul>
  </div>

  {{ partial "social.html" . }}

  {{ partial "copyright.html" . }}
</div>
