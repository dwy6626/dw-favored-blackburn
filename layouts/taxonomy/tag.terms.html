{{ define "title" }}
  {{ T .Title }}
{{ end }}

{{ define "main" }}
  <div class="tag-list">
    <ul class="fa-ul">
      {{ range $key, $value := .Data.Terms.ByCount }}
      <li>
        <a href="{{ $value.Name | urlize }}" class="circular">
          <span class="fa-li"><i class="fas fa-tag fa-fw"></i></span>
          {{ $value.Name }}
        </a>
        <span>&#40;{{ $value.Count }}&#41;</span>
      </li>
    {{ end }}
    </ul>
  </div>
{{ end }}
