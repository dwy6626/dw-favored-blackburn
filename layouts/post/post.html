{{ define "title" }}
  {{ T .Title }}
{{ end }}

{{ define "main" }}
  {{ with .Site.GetPage "section" "post" }}
    {{ range .RegularPages.GroupByDate "2006" }}
      <h2>{{ .Key }}</h2>
      <ul>
        {{ range .Pages }}
          {{ .Render "li" }}
        {{ end }}
      </ul>
    {{ end }}
  {{ end }}
{{ end }}
